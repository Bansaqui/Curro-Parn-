name: Deploy prototype to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'prototype/current/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static prototype only
        run: |
          mkdir -p _site/prototype/current
          cp prototype/current/index.html _site/prototype/current/index.html
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><html lang="es"><meta charset="utf-8"><title>Curro &amp; Parné</title><a href="prototype/current/index.html">Abrir prototipo actual</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
