<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>Curro & Parné · V9.4.8 Gestión de oferta visible QA</title>
<style>
:root{
  --coal:#151515; --coal2:#24211e; --ivory:#F7F4EE; --paper:#FFFDF9; --paper2:#FBF7F0;
  --copper:#B9894D; --copper2:#D0A46E; --green:#23855B; --red:#C84B4B; --amber:#AA7136;
  --muted:#7E786F; --line:#E6DFD4; --soft:#EEE8DE; --shadow:0 16px 42px rgba(21,21,21,.09);
  --shadow-soft:0 8px 24px rgba(21,21,21,.05);
}
*{box-sizing:border-box}
html{background:#e9e4dc}
body{margin:0;background:#e9e4dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--coal)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  max-width:430px;margin:0 auto;min-height:100vh;background:var(--ivory);
  position:relative;padding-bottom:112px;box-shadow:0 0 48px rgba(0,0,0,.08)
}
.top{
  position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;
  background:linear-gradient(180deg,rgba(247,244,238,.97),rgba(247,244,238,.78),transparent);
  backdrop-filter:blur(12px)
}
.brandrow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(23,23,23,.97);border-radius:23px;padding:8px 8px 8px 14px;
  box-shadow:0 14px 34px rgba(0,0,0,.19), inset 0 0 0 1px rgba(255,255,255,.05)
}
.brand{font-size:17px;font-weight:950;letter-spacing:.02em;color:white}.brand span{color:var(--copper2)}
.mode{
  display:flex;gap:4px;background:#2B2927;padding:4px;border-radius:999px
}
.mode button{
  border:0;background:transparent;border-radius:999px;padding:7px 9px;
  font-size:10px;font-weight:900;color:#A9A29A;transition:.18s
}
.mode button.on{
  background:linear-gradient(180deg,#C7985C,#B9894D);color:white;
  box-shadow:0 6px 14px rgba(185,137,77,.25)
}
main{padding:8px 14px 18px}
.screen{display:none}.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.45;transform:translateY(2px)}to{opacity:1;transform:none}}
.hero{
  background:linear-gradient(145deg,var(--coal),#2A2521);color:white;border-radius:26px;
  padding:21px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  right:-68px;top:-72px;background:radial-gradient(circle,rgba(185,137,77,.38),transparent 68%)
}
.hero .eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:950;color:#D9BD93}
.hero h1{font-size:29px;line-height:1.01;margin:8px 0 9px;max-width:310px}
.hero p{margin:0;color:#D8D1C9;font-size:13px;line-height:1.48;max-width:330px}
.hero .hero-actions{display:flex;gap:8px;margin-top:18px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 3px 10px}
.section-title h2{margin:0;font-size:17px;letter-spacing:-.01em}
.section-title button{border:0;background:none;color:var(--copper);font-weight:900;font-size:12px}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:15px;
  margin-bottom:11px;box-shadow:var(--shadow-soft)
}
.card.job{background:linear-gradient(180deg,#FFFDF9,#F8F0E4);border-color:#DEC29B}
.card.dark{background:linear-gradient(145deg,#1A1918,#282522);border-color:#2D2A27;color:white}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12px;line-height:1.45}
.dark .muted{color:#B9B1A8}
.small{font-size:11px}.big{font-size:29px;font-weight:950;letter-spacing:-.03em}
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;
  font-size:10px;font-weight:950;letter-spacing:.02em
}
.pill.gold{background:#F1E4D0;color:#77542C}.pill.green{background:#E5F0E9;color:var(--green)}
.pill.red{background:#F6E5E5;color:#9A3D3D}.pill.dark{background:#2D2A27;color:#EBD7B6}
.pill.soft{background:#EFEAE2;color:#615A52}
.btn{
  width:100%;border:0;border-radius:15px;padding:13px 15px;font-weight:900;
  transition:.16s transform,.16s opacity;min-height:46px
}
.btn:active{transform:scale(.985)}.btn.primary{background:var(--coal);color:white}
.btn.copper{background:linear-gradient(180deg,#C5965B,#B9894D);color:white}
.btn.green{background:var(--green);color:white}.btn.light{background:var(--soft);color:var(--coal)}
.btn.red{background:#F6E5E5;color:#9A3D3D}.btn.ghost{background:transparent;color:var(--coal);border:1px solid var(--line)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:#EFEAE2;color:#5E584F;font-size:11px;padding:6px 8px;border-radius:999px}
.notice{
  padding:11px 12px;border-radius:15px;background:#F1E8DA;color:#6B5134;font-size:12px;line-height:1.45
}
.notice.success{background:#E8F3EC;color:#246844}.notice.warn{background:#F7E8E8;color:#9A3D3D}
.notice.dark{background:#252321;color:#D9D2C8}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.avatar{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--coal);color:white;font-weight:950;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)
}
.avatar.gold{background:var(--copper)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis .card{padding:12px}.kpis b{font-size:20px;display:block;letter-spacing:-.03em}
.kpis span{font-size:10px;color:var(--muted)}
.progress{display:flex;gap:5px;margin:13px 0}
.progress i{height:5px;flex:1;border-radius:999px;background:#E3DCD1}
.progress i.on{background:var(--copper)}
.nextstep{
  margin:12px 0 0;padding:12px;border-radius:16px;background:#F4EEE5;border:1px solid #E7D7C0
}
.nextstep strong{display:block;font-size:12px;margin-bottom:3px}
.route{
  height:220px;border-radius:20px;background:linear-gradient(120deg,rgba(185,137,77,.18),transparent 35%),linear-gradient(25deg,#DBD4C9,#F9F6F0);
  position:relative;overflow:hidden;border:1px solid var(--line)
}
.route:before,.route:after{content:"";position:absolute;background:white;border-radius:999px;box-shadow:0 0 0 1px #D6CFC5}
.route:before{width:340px;height:18px;left:-24px;top:105px;transform:rotate(-18deg)}
.route:after{height:300px;width:16px;left:228px;top:-28px;transform:rotate(23deg)}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;z-index:3;box-shadow:0 0 0 5px rgba(255,255,255,.9)}
.dot.me{background:var(--copper);left:70px;top:150px}.dot.dest{background:var(--coal);right:58px;top:50px}
.route-line{position:absolute;left:82px;top:144px;width:210px;height:5px;background:var(--copper);transform:rotate(-25deg);transform-origin:left center;z-index:2;border-radius:999px}
.comms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.comms .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.chat-list{display:grid;gap:10px;margin-top:10px}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:12px;line-height:1.45}
.bubble.me{justify-self:end;background:var(--coal);color:white;border-bottom-right-radius:5px}
.bubble.them{justify-self:start;background:#EEE8DE;color:var(--coal);border-bottom-left-radius:5px}
.bubble.system{justify-self:center;max-width:92%;background:#F2E7D6;color:#70512E;font-size:11px;text-align:center}
.chat-compose{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.chat-compose input{margin:0}
.quick{display:flex;gap:6px;overflow:auto;padding:2px 0 4px;margin-top:10px}
.quick button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800}
.timeline{display:grid;gap:10px}.tl{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.tl b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#E7E1D7;font-size:11px}
.tl.done b{background:var(--green);color:white}.tl.current b{background:var(--copper);color:white}
.tl p{margin:2px 0 0;font-size:12px}.tl small{color:var(--muted)}
.contract-steps{display:grid;gap:8px;margin-top:12px}
.contract-step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.contract-step:last-child{border-bottom:0}
.contract-step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#E8E1D7;font-size:11px}
.contract-step.done b{background:var(--green);color:white}.contract-step.current b{background:var(--copper);color:white}
.nav-wrap{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(410px,calc(100% - 20px));
  z-index:30;padding-bottom:env(safe-area-inset-bottom)
}
.nav{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;
  background:rgba(23,23,23,.96);backdrop-filter:blur(18px);border-radius:24px;
  box-shadow:0 16px 40px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.05)
}
.nav button{
  position:relative;border:0;background:transparent;color:#A9A29A;font-size:9px;font-weight:850;
  padding:8px 2px 7px;border-radius:17px;transition:.18s
}
.nav button.on{background:#2B2927;color:white}
.nav .ico{
  display:grid;place-items:center;width:28px;height:28px;margin:0 auto 2px;border-radius:10px;
  font-size:16px
}
.nav button.on .ico{background:linear-gradient(180deg,#C7985C,#B9894D);color:white;box-shadow:0 7px 16px rgba(185,137,77,.28)}
.badge{
  position:absolute;top:4px;right:16px;min-width:16px;height:16px;border-radius:999px;background:var(--red);color:white;
  display:grid;place-items:center;font-size:9px;font-weight:900;padding:0 4px
}
.modal{
  position:fixed;inset:0;background:rgba(15,15,15,.6);display:none;align-items:end;justify-content:center;z-index:60
}
.modal.on{display:flex}
.sheet{
  width:min(430px,100%);background:var(--ivory);border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.16)
}
.sheet-handle{width:42px;height:4px;border-radius:999px;background:#D8D1C7;margin:0 auto 14px}
input,select,textarea{
  width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:12px;margin:5px 0 10px;color:var(--coal);outline:none
}
input:focus,select:focus,textarea:focus{border-color:#C8A373;box-shadow:0 0 0 3px rgba(185,137,77,.1)}
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(18px);background:var(--coal);color:white;
  padding:11px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:90
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.divider{height:1px;background:var(--line);margin:12px 0}
.call-box{text-align:center;padding:12px 2px}.call-icon{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:10px auto 12px;background:var(--green);color:white;font-size:28px;box-shadow:0 12px 28px rgba(35,133,91,.25)}
.shift-clock{
  margin:12px 0;padding:15px;border-radius:20px;background:linear-gradient(145deg,#171716,#292622);
  color:white;box-shadow:0 14px 30px rgba(21,21,21,.16);position:relative;overflow:hidden
}
.shift-clock:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-44px;top:-55px;background:radial-gradient(circle,rgba(185,137,77,.38),transparent 68%)}
.shift-clock .clock-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#D4B68E;font-weight:950}
.shift-clock .clock-time{font-size:35px;line-height:1;font-weight:950;letter-spacing:.02em;margin:7px 0 5px;position:relative;z-index:1}
.shift-clock .clock-sub{font-size:11px;color:#C7C0B8;position:relative;z-index:1}
.shift-clock .mini-action{margin-top:11px;border:1px solid rgba(255,255,255,.12);background:#302D2A;color:white;border-radius:12px;padding:9px 11px;font-size:10px;font-weight:900;position:relative;z-index:2}
.history-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:0}
.alarm-badge{display:inline-flex;align-items:center;gap:6px;background:#F2E4D2;color:#77542C;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:950}
.vault{
  background:linear-gradient(145deg,#171716,#292622);color:white;border-radius:22px;padding:16px;
  box-shadow:0 14px 32px rgba(21,21,21,.14);margin:10px 0;position:relative;overflow:hidden
}
.vault:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;top:-65px;background:radial-gradient(circle,rgba(185,137,77,.34),transparent 70%)}
.vault-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.lock{width:38px;height:38px;border-radius:13px;background:#34302C;display:grid;place-items:center;font-size:18px}
.secure-row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:1}
.secure-row:last-child{border-bottom:0}
.secure-row .ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(35,133,91,.22);color:#78D5A8;font-size:11px;font-weight:950}
.secure-row small{color:#AAA39B}
.permission{background:#F4EEE5;border:1px solid #E4D4BD;border-radius:17px;padding:12px;margin:10px 0}
.permission strong{display:block;font-size:12px}
.permission .why{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}
.data-mask{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.chat-alert{position:relative}
.chat-alert .unread{
  position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--red);color:white;display:grid;place-items:center;font-size:9px;font-weight:950;
  box-shadow:0 0 0 3px var(--paper)
}
.chat-head-alert{display:inline-flex;align-items:center;gap:6px}
.chat-head-alert i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #F7E7E7}
.quick-wrap{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:none}
.quick-wrap::-webkit-scrollbar{display:none}
.quick-chip{flex:0 0 auto;border:1px solid #DDD2C4;background:#FFFDF9;border-radius:999px;padding:9px 11px;font-size:10px;font-weight:850;color:#34302C;cursor:pointer}
.quick-chip:active{transform:scale(.97)}
.quick-label{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 6px}
.service-entry{
  cursor:pointer;
  border:1px solid rgba(185,137,77,.18);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  position:relative;
  overflow:hidden
}
.service-entry:before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;
  border-radius:0 99px 99px 0;background:var(--copper)
}
.service-entry:active{transform:scale(.985)}
.service-entry:hover{box-shadow:0 12px 28px rgba(21,21,21,.09);border-color:rgba(185,137,77,.34)}
.progress-link{
  display:inline-flex;align-items:center;gap:6px;
  background:#F4EADF;color:#7A552D;border:1px solid #E5D3BD;
  border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950;
  letter-spacing:.02em;white-space:nowrap
}
.progress-link .arrow{font-size:12px;line-height:1;transition:transform .16s ease}
.service-entry:active .progress-link .arrow{transform:translateX(2px)}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 4px rgba(35,133,91,.12);display:inline-block;margin-right:2px
}
.rating-stars{display:flex;gap:7px;margin:10px 0 12px}
.star-btn{border:0;background:#EEE7DD;color:#B7AA99;width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer;transition:.15s ease}
.star-btn.active{background:#F1E3D2;color:var(--copper);transform:translateY(-1px)}
.star-btn:active{transform:scale(.96)}
.review-box{background:#FBF8F2;border:1px solid #E9DED0;border-radius:18px;padding:13px;margin:10px 0}
.review-box .review-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.review-box p{margin:8px 0 0;font-size:11px;line-height:1.5;color:#5E5850}
.doc-section{background:#FBF8F2;border:1px solid #E9DED0;border-radius:16px;padding:12px;margin:9px 0}
.doc-section h4{margin:0 0 6px;font-size:11px}
.doc-line{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid #EEE6DC;font-size:10px}
.doc-line:last-child{border-bottom:0}
.reference-note{font-size:10px;color:var(--muted);line-height:1.45}






@media(min-width:650px){body{padding:16px 0}.app{border-radius:30px;min-height:calc(100vh - 32px);overflow:hidden}.nav-wrap{bottom:26px}}

.market-hero{background:linear-gradient(145deg,#171717,#29241e);color:#fff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 14px 34px rgba(21,21,21,.15)}
.market-hero .muted{color:#cfc6bb}.fill-track{height:8px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;margin:12px 0 7px}.fill-bar{height:100%;background:var(--copper);border-radius:99px}.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.slot{border:1px solid #e7ded3;background:#fbf8f2;border-radius:14px;padding:10px 6px;text-align:center;font-size:9px;font-weight:850}.slot.filled{background:#edf7f1;border-color:#cde7d7;color:#1e704e}.match-card{border:1px solid #e8dfd4;background:#fff;border-radius:19px;padding:13px;margin:9px 0}.match-score{font-size:10px;font-weight:950;color:#7a552d;background:#f4eadf;border:1px solid #e5d3bd;border-radius:999px;padding:6px 8px;white-space:nowrap}.match-reasons{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.reason{font-size:8px;font-weight:850;background:#f4f2ee;border-radius:999px;padding:5px 7px;color:#625c54}.newcomer{background:#edf3f8;color:#48657a;border:1px solid #d8e4ec}.market-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:3px;margin:9px 0}.market-tab{border:1px solid #e3d8cb;background:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900;white-space:nowrap;cursor:pointer}.market-tab.active{background:#171717;color:#fff;border-color:#171717}

.referral-card{border:1px solid #e5d6c3;background:linear-gradient(145deg,#fffaf3,#f7efe4);border-radius:22px;padding:15px;margin:12px 0}
.referral-flow{display:grid;gap:7px;margin:12px 0}.ref-step{display:flex;align-items:center;gap:9px;font-size:10px}.ref-step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eee8df}.ref-step.done b{background:#e4f2e9;color:#21734f}.ref-step.current b{background:#b9894d;color:white}

.cv-card{border:1px solid #e3ddd3;background:#fff;border-radius:18px;padding:14px;margin:10px 0}
.cv-secure{border:1px solid #d9e9df;background:#f6fbf8;border-radius:16px;padding:12px;margin:10px 0}
.security-list{display:grid;gap:7px;margin-top:8px}.security-item{display:flex;gap:8px;align-items:flex-start;font-size:11px}
.security-dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#e6f3ea;color:#23855b;font-weight:800;flex:0 0 auto}
.cv-upload{border:1px dashed #cbb89f;border-radius:16px;padding:12px;background:#fffaf5}

.job-switcher{display:grid;gap:9px;margin:10px 0 16px}
.job-switch{border:1px solid #e5dfd5;background:#fff;border-radius:16px;padding:12px;text-align:left;width:100%;cursor:pointer}

.job-switch .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}

  <div class="sheet"><div class="sheet-handle"></div><div id="sheet"></div></div>

<script>
const JOB_STATES=[
 'draft','published','interest','selected','docs_pending','terms_pending','worker_accept_pending',
 'confirmed','preparing','en_route','arrived','checked_in','working','finished',
 'payment_pending','business_paid','closed','cancelled'
];

const initial={
  demoRole:'worker',
  worker:{name:'Jonathan Gómez',available:true,money:235,completed:24,rating:4.9,punctuality:100,
  availability:{instant:true,mode:'open',
    today:{enabled:true,start:'00:00',end:'23:59'},
    tomorrow:{enabled:true,start:'00:00',end:'23:59'},
    updatedAt:null}}, 
  business:{name:'La Terraza del Puerto',rating:4.8,payAvg:'12 min'},
  job:null,
  jobs:[],
  activeJobId:null,
  proposal:null,
  relation:{jobsTogether:0,mutualRating:null,favorite:false},
  chat:[],
  history:[],
  jobCounter:0,
  unread:{worker:0,biz:0},
  notifications:[],
  vault:{identity:true,social:true,labor:true},
  reviews:[]
};



const ASSIGNMENT_STATES=[
 'selected','docs_pending','terms_pending','worker_accept_pending','confirmed','preparing',
 'en_route','arrived','checked_in','working','finished','payment_pending','business_paid','closed',
 'cancelled','no_show','replaced'
];

function freshAssignment(candidate){
 return {slotReleased:false,releasedAt:null,releaseReason:null,previousState:null,
   id:`${S.job?.id||'JOB'}-${candidate.id}`,
   candidateId:candidate.id,
   name:candidate.name,
   role:candidate.role,
   state:'selected',
   secureFlow:{requested:false,authorized:false,conditionsViewed:false},
   businessPaid:false,
   workerPaid:false,
   checkedInAt:null,
   shiftEndAt:null,
   incidentOpen:false,
   ratedByWorker:false,
   ratedByBusiness:false,
   reviews:{worker:null,biz:null},
   selectedAt:Date.now()
 };
}
function ensureAssignments(job=S.job, marketplace=S.marketplace){
 if(!job)return [];
 job.assignments=Array.isArray(job.assignments)?job.assignments:[];
 const candidates=marketplace?.candidates||[];
 for(const c of candidates){
   if(c.status==='selected' && !job.assignments.some(a=>a.candidateId===c.id)){
     job.assignments.push(freshAssignment(c));
   }
 }
 job.assignments=job.assignments.map(a=>{
   const x={
     slotReleased:Boolean(a.slotReleased),
     releasedAt:a.releasedAt||null,
     releaseReason:a.releaseReason||null,
     previousState:a.previousState||null,
     ...a
   };
   const releasedStates=['cancelled','no_show','replaced'];
   // Self-heal impossible combinations in old/corrupt persisted data.
   if(x.slotReleased && !releasedStates.includes(x.state)){
     x.state=releasedStates.includes(x.releaseReason)?x.releaseReason:'cancelled';
   }
   if(releasedStates.includes(x.state) && !x.slotReleased){
     x.slotReleased=true;
     x.releaseReason=x.releaseReason||x.state;
     x.releasedAt=x.releasedAt||Date.now();
   }
   return x;
 });
 return job.assignments;
}
function assignmentFor(candidateId,job=S.job){
 return ensureAssignments(job,S.marketplace).find(a=>a.candidateId===candidateId)||null;
}
function upsertAssignment(candidate){
 let a=assignmentFor(candidate.id);
 if(a){
   if(a.slotReleased||assignmentIsReplaceable(a)){
     a.slotReleased=false;
     a.releasedAt=null;
     a.releaseReason=null;
     a.previousState=a.state;
     a.state='selected';
     a.selectedAt=Date.now();
   }
   return a;
 }
 if(occupiedSlotsFor()>=marketTotal())return null;
 a=freshAssignment(candidate);S.job.assignments.push(a);
 return a;
}
function removeAssignment(candidateId){
 if(!S.job)return;
 S.job.assignments=ensureAssignments().filter(a=>a.candidateId!==candidateId);
}
function assignmentLabel(st){
 const m={cancelled:'Cancelado',no_show:'No presentado',replaced:'Reemplazado'};
 return m[st]||jobLabel(st);
}
function assignmentCompleted(a){return !!a && a.state==='closed' && a.ratedByWorker && a.ratedByBusiness && !a.incidentOpen}
function assignmentProgress(a){
 if(!a)return '';
 return `<div class="progress">${['selected','terms_pending','confirmed','checked_in','working','payment_pending','closed'].map(s=>`<i class="${stateIndex(a.state)>=stateIndex(s)?'on':''}"></i>`).join('')}</div>`;
}
function assignmentCandidate(id){return S.marketplace?.candidates?.find(c=>c.id===id)||null}

function scheduleDayIndex(label){
 const s=String(label||'').toLowerCase();
 if(s.includes('mañana'))return 1;
 if(s.includes('hoy'))return 0;
 const m=s.match(/(\d{1,2})[\/-](\d{1,2})/);
 if(m)return Number(m[1])*40+Number(m[2]);
 return 0;
}
function hmMinutes(v){
 const m=String(v||'').match(/(\d{1,2}):(\d{2})/);
 return m?Number(m[1])*60+Number(m[2]):0;
}
function intervalForJob(job){
 const day=scheduleDayIndex(job?.date);
 let start=day*1440+hmMinutes(job?.start);
 let end=day*1440+hmMinutes(job?.end);
 if(end<=start)end+=1440;
 return [start,end];
}
function intervalsOverlap(a,b){
 const [as,ae]=intervalForJob(a),[bs,be]=intervalForJob(b);
 return Math.max(as,bs)<Math.min(ae,be);
}
function workerCommittedInRecord(r){
 const committedStates=['selected','docs_pending','terms_pending','worker_accept_pending','confirmed','preparing','en_route','arrived','checked_in','working'];
 const a=(r?.job?.assignments||[]).find(x=>x.candidateId==='p1');
 if(a){
   if(a.slotReleased||['cancelled','no_show','replaced','finished','payment_pending','business_paid','closed'].includes(a.state))return false;
   return committedStates.includes(a.state);
 }
 const me=(r?.marketplace?.candidates||[]).find(c=>c.id==='p1');
 return !!me && me.status==='selected' && committedStates.includes(r.job?.state);
}
function workerScheduleConflict(targetJob=S.job){
 if(!targetJob)return null;
 syncActiveJobRecord();
 return (S.jobs||[]).find(r=>
   r.id!==targetJob.id &&
   workerCommittedInRecord(r) &&
   intervalsOverlap(r.job,targetJob)
 )||null;
}
function conflictText(rec){
 return rec?`${rec.id} · ${rec.job?.date||''} ${rec.job?.start||''}–${rec.job?.end||''}`:'';
}

function syncJonathanAssignmentFromJob(){
 if(!S.job || !S.marketplace)return;
 const me=workerCandidate();
 if(!me || me.status!=='selected')return;
 const a=upsertAssignment(me);
 a.state=S.job.state;
 a.secureFlow=cloneData(S.job.secureFlow||a.secureFlow);
 a.businessPaid=!!S.job.businessPaid;
 a.workerPaid=!!S.job.workerPaid;
 a.shiftEndAt=S.job.shiftEndAt||a.shiftEndAt;
 a.incidentOpen=!!S.job.incidentOpen;
 a.ratedByWorker=!!S.job.ratedByWorker;
 a.ratedByBusiness=!!S.job.ratedByBusiness;
 a.reviews=cloneData(S.job.reviews||a.reviews);
}
function syncJobFromJonathanAssignment(){
 if(!S.job)return;
 const a=assignmentFor('p1');
 if(!a)return;
 S.job.state=a.state;
 S.job.secureFlow=cloneData(a.secureFlow);
 S.job.businessPaid=!!a.businessPaid;
 S.job.workerPaid=!!a.workerPaid;
 S.job.shiftEndAt=a.shiftEndAt||null;
 S.job.incidentOpen=!!a.incidentOpen;
 S.job.ratedByWorker=!!a.ratedByWorker;
 S.job.ratedByBusiness=!!a.ratedByBusiness;
 S.job.reviews=cloneData(a.reviews||{worker:null,biz:null});
}
function recomputeJobSummaryState(){
 if(!S.job)return;
 const as=ensureAssignments();
 if(!as.length)return;
 const consuming=as.filter(assignmentConsumesSlot);
 if(!consuming.length){
   // No active/historical coverage: the Curro is again available if it still has open slots.
   if(openSlotsFor()>0 && !['draft','published','interest'].includes(S.job.state))S.job.state='published';
   return;
 }
 const unresolved=consuming.filter(a=>a.state!=='closed');
 if(!unresolved.length){S.job.state='closed';return;}
 const minRank=Math.min(...unresolved.map(a=>stateIndex(a.state)));
 const earliest=unresolved.find(a=>stateIndex(a.state)===minRank);
 if(earliest?.candidateId==='p1'){
   syncJobFromJonathanAssignment();
 }else{
   S.job.state=earliest?.state||'selected';
 }
}
function cloneData(v){return v==null?v:JSON.parse(JSON.stringify(v))}

function numericJobId(id){
 const m=String(id||'').match(/^CP-(\d+)$/);
 return m?Number(m[1]):0;
}
function repairAssignmentInvariant(a){
 if(!a)return a;
 a.secureFlow={requested:false,authorized:false,conditionsViewed:false,...(a.secureFlow||{})};
 a.businessPaid=Boolean(a.businessPaid);
 a.workerPaid=Boolean(a.workerPaid);
 a.ratedByWorker=Boolean(a.ratedByWorker);
 a.ratedByBusiness=Boolean(a.ratedByBusiness);
 a.reviews={worker:null,biz:null,...(a.reviews||{})};
 a.slotReleased=Boolean(a.slotReleased);
 a.releasedAt=a.releasedAt||null;
 a.releaseReason=a.releaseReason||null;
 a.previousState=a.previousState||null;
 const releasedStates=['cancelled','no_show','replaced'];

 // Released assignments are a valid audit state and must never be promoted back to selected.
 if(a.slotReleased || releasedStates.includes(a.state)){
   a.slotReleased=true;
   if(!releasedStates.includes(a.state))a.state=releasedStates.includes(a.releaseReason)?a.releaseReason:'cancelled';
   a.releaseReason=a.releaseReason||a.state;
   a.releasedAt=a.releasedAt||Date.now();
   a.businessPaid=false;
   a.workerPaid=false;
   return a;
 }

 if(a.workerPaid){
   a.businessPaid=true;
   a.state='closed';
 }else if(a.businessPaid && stateIndex(a.state)<stateIndex('business_paid')){
   a.state='business_paid';
 }
 if(!ASSIGNMENT_STATES.includes(a.state))a.state='selected';
 return a;
}
function repairJobInvariant(job, marketplace){
 if(!job)return job;
 job.assignments=Array.isArray(job.assignments)?job.assignments.map(repairAssignmentInvariant):[];
 job.businessPaid=Boolean(job.businessPaid);
 job.workerPaid=Boolean(job.workerPaid);
 if(job.workerPaid){
   job.businessPaid=true;
   job.state='closed';
 }else if(job.businessPaid && stateIndex(job.state)<stateIndex('business_paid') && stateIndex(job.state)>=stateIndex('payment_pending')){
   job.state='business_paid';
 }
 const p1=job.assignments.find(a=>a.candidateId==='p1');
 if(p1){
   if(job.businessPaid||p1.businessPaid){
     job.businessPaid=p1.businessPaid=true;
     if(stateIndex(p1.state)<stateIndex('business_paid'))p1.state='business_paid';
   }
   if(job.workerPaid||p1.workerPaid){
     job.workerPaid=p1.workerPaid=true;
     job.businessPaid=p1.businessPaid=true;
     p1.state='closed';
     job.state='closed';
   }else if(job.businessPaid && job.state==='payment_pending'){
     job.state='business_paid';
   }
 }
 if(!JOB_STATES.includes(job.state))job.state='published';
 return job;
}
function recordFreshness(r){
 return Number(r?.updatedAt)||Number(r?.job?.updatedAt)||Number(r?.job?.closedAt)||0;
}
function chooseCanonicalRecord(a,b,activeJob){
 if(!a)return b;if(!b)return a;
 if(activeJob && activeJob.id===a.id){
   const current=makeJobRecord(activeJob,S.marketplace,S.chat,S.referral);
   current.updatedAt=Date.now();
   return current;
 }
 const af=recordFreshness(a),bf=recordFreshness(b);
 if(af!==bf)return af>bf?a:b;
 const ar=stateIndex(a.job?.state),br=stateIndex(b.job?.state);
 if(ar!==br)return ar>br?a:b;
 const ap=(a.job?.workerPaid?2:0)+(a.job?.businessPaid?1:0);
 const bp=(b.job?.workerPaid?2:0)+(b.job?.businessPaid?1:0);
 return bp>ap?b:a;
}
function dedupeJobRecords(records,activeJob){
 const map=new Map();
 for(const raw of (records||[])){
   if(!raw?.id||!raw?.job)continue;
   raw.job.id=raw.id;
   repairJobInvariant(raw.job,raw.marketplace);
   const prev=map.get(raw.id);
   map.set(raw.id,chooseCanonicalRecord(prev,raw,activeJob));
 }
 return [...map.values()];
}
function repairActivePaymentState(){
 if(!S.job)return;
 repairJobInvariant(S.job,S.marketplace);
 const a=assignmentFor('p1');
 if(a){
   repairAssignmentInvariant(a);
   if(a.businessPaid && !S.job.businessPaid)S.job.businessPaid=true;
   if(a.workerPaid && !S.job.workerPaid)S.job.workerPaid=true;
   if(S.job.workerPaid){S.job.state='closed';a.state='closed';}
   else if(S.job.businessPaid && S.job.state==='payment_pending'){S.job.state='business_paid';a.state='business_paid';}
 }
}

function makeJobRecord(job, marketplace, chat, referral){
 const j=cloneData(job);
 repairJobInvariant(j,marketplace);
 return {id:j.id,job:j,marketplace:cloneData(marketplace),chat:cloneData(chat||[]),referral:cloneData(referral||null),updatedAt:Date.now()};
}
function activeJobRecord(){
 return (S.jobs||[]).find(r=>r.id===S.activeJobId)||null;
}
function syncActiveJobRecord(){
 if(!S.job)return;
 ensureAssignments();
 repairActivePaymentState();
 syncJonathanAssignmentFromJob();
 repairJobInvariant(S.job,S.marketplace);
 S.jobs=Array.isArray(S.jobs)?S.jobs:[];
 const rec=makeJobRecord(S.job,S.marketplace,S.chat,S.referral);
 S.jobs=S.jobs.filter(r=>r?.id!==S.job.id);
 S.jobs.unshift(rec);
 S.jobs=dedupeJobRecords(S.jobs,S.job);
 S.activeJobId=S.job.id;
}
function loadJobRecord(id){
 if(!id)return false;
 syncActiveJobRecord();
 S.jobs=dedupeJobRecords(S.jobs,S.job);
 const rec=(S.jobs||[]).find(r=>r.id===id);
 if(!rec)return false;
 S.activeJobId=rec.id;
 S.job=cloneData(rec.job);
 S.marketplace=cloneData(rec.marketplace);
 S.chat=cloneData(rec.chat||[]);
 S.referral=cloneData(rec.referral);
 ensureMarketplace();ensureReferral();ensureAssignments();
 repairActivePaymentState();
 return true;
}
function selectJob(id,page){
 if(!loadJobRecord(id)){toast('No se encontró el Curro');return;}
 markNotificationsRead(S.demoRole,id);
 save();renderAll();
 if(page)go(page,document.querySelector(`[data-page="${page}"]`));
}
function jobRecords(){
 syncActiveJobRecord();
 S.jobs=dedupeJobRecords(S.jobs,S.job);
 return (S.jobs||[]).slice().sort((a,b)=>{
   const ac=a.job?.state==='closed'?1:0,bc=b.job?.state==='closed'?1:0;
   if(ac!==bc)return ac-bc;
   return String(b.id).localeCompare(String(a.id));
 });
}
function openJobRecords(){
 return jobRecords().filter(r=>r.job?.state!=='closed' || !(r.job?.ratedByWorker&&r.job?.ratedByBusiness));
}
function jobRecordNeedsBusinessAttention(r){
 return businessAttentionReasons(r).length>0;
}
function jobMiniCard(r,role='biz',page='curros'){
 const j=r.job||{};
 const active=r.id===S.activeJobId;
 const rejectedNotice=role==='worker'&&workerRejectionPendingRecord(r);
 const hasUnread=unreadNotificationsForJob(role==='worker'?'worker':'biz',r.id).length>0;
 const total=Math.max(1,Number(j.workers)||1);
 const occupied=occupiedSlotsFor(j,r.referral);
 const open=Math.max(0,total-occupied);
 const needsReplacement=role==='biz'&&open>0&&(j.assignments||[]).some(assignmentIsReplaceable);
 const status=rejectedNotice?'No seleccionado':needsReplacement?'Reemplazo necesario':hasUnread&&page==='activity'?'Nuevo':jobLabel(j.state);
 return `<button class="job-switch ${active?'active':''}" onclick="selectJob('${r.id}','${page}')">
   <div class="topline"><strong>${r.id} · ${j.role}</strong><span class="pill ${rejectedNotice||needsReplacement?'red':hasUnread&&page==='activity'?'gold':j.state==='closed'?'green':'gold'}">${status}</span></div>
   <div class="meta">${j.date||''} · ${j.start||''}–${j.end||''} · ${j.zone||''}</div>
   <div class="meta">${role==='biz'?`${occupied}/${total} plazas${open?` · ${open} ${open===1?'vacante':'vacantes'}`:''} · `:''}${money(j.pay||0)}${active?' · ABIERTO':''}</div>
 </button>`;
}
function workerRejectionPendingRecord(r){
 const n=r?.job?.rejectionNotice;
 return !!(n && n.type==='business_rejection' && !n.acknowledged);
}
function currentWorkerRejectionPending(){
 return !!(S.job?.rejectionNotice?.type==='business_rejection' && !S.job.rejectionNotice.acknowledged);
}
function acknowledgeWorkerRejection(){
 if(!S.job || !currentWorkerRejectionPending()){toast('Este aviso ya está resuelto');return;}
 S.job.rejectionNotice.acknowledged=true;
 S.job.rejectionNotice.acknowledgedAt=Date.now();
 markNotificationsRead('worker',S.job.id);
 save();renderAll();toast('Aviso archivado');
}

function workerEligibleRecord(r){
 const j=r?.job;if(!j)return false;
 if(!S.worker.available && j.state==='published')return false;
 if(!professionalCanDo(j.role))return false;
 const me=(r.marketplace?.candidates||[]).find(c=>c.id==='p1');
 const blocked=['rejected','worker_rejected','worker_withdrawn'];
 if(me&&blocked.includes(me.status))return false;
 if(['rejected_by_worker','withdrawn','rejected_by_business'].includes(j.workerDecision))return false;
 if(j.state==='published')return availabilityCoversJob(j);
 return !!me && ['interested','selected','invited'].includes(me.status);
}
function normalizeState(raw){
 const x=raw&&typeof raw==='object'?raw:JSON.parse(JSON.stringify(initial));
 x.demoRole=x.demoRole==='biz'?'biz':'worker';
 x.jobs=Array.isArray(x.jobs)?x.jobs:[];
 x.activeJobId=x.activeJobId||x.job?.id||x.jobs[0]?.id||null;
 x.worker={...initial.worker,...(x.worker||{})};
 const av=x.worker.availability||{};
 x.worker.availability={
   instant:av.instant!==false,
   mode:av.mode==='custom'?'custom':'open',
   today:{enabled:av.today?.enabled!==false,start:av.today?.start||'00:00',end:av.today?.end||'23:59'},
   tomorrow:{enabled:av.tomorrow?.enabled!==false,start:av.tomorrow?.start||'00:00',end:av.tomorrow?.end||'23:59'},
   updatedAt:av.updatedAt||null
 };
 x.business={...initial.business,...(x.business||{})};
 x.relation={...initial.relation,...(x.relation||{})};
 x.chat=Array.isArray(x.chat)?x.chat:[];
 x.history=Array.isArray(x.history)?x.history:[];
 x.history.forEach(h=>{if(h.archived===undefined)h.archived=true;});
 x.jobCounter=Number.isFinite(x.jobCounter)?x.jobCounter:(x.job?1:0);
 x.unread={worker:Number(x.unread?.worker)||0,biz:Number(x.unread?.biz)||0};
 x.notifications=Array.isArray(x.notifications)?x.notifications.filter(n=>n&&n.recipient&&n.title).map(n=>({
   id:n.id||`N-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
   jobId:n.jobId||null,recipient:n.recipient,type:n.type||'info',title:n.title,
   message:n.message||'',read:Boolean(n.read),ts:Number(n.ts)||Date.now(),readAt:n.readAt||null
 })) : [];
 x.vault={...initial.vault,...(x.vault||{})};
 x.reviews=Array.isArray(x.reviews)?x.reviews:[];
 if(x.job && !x.jobs.some(r=>r&&r.id===x.job.id)){
   x.jobs.unshift(makeJobRecord(x.job,x.marketplace,x.chat,x.referral));
 }
 if(!x.job && x.activeJobId){
   const rec=x.jobs.find(r=>r&&r.id===x.activeJobId);
   if(rec){x.job=cloneData(rec.job);x.marketplace=cloneData(rec.marketplace);x.chat=cloneData(rec.chat||[]);x.referral=cloneData(rec.referral);}
 }
 if(x.job){
   x.job.workerDecision=x.job.workerDecision||'pending';
   x.job.workerInterest=Boolean(x.job.workerInterest);
   if(x.job.state==='published'&&x.job.workerDecision==='interested')x.job.state='interest';
   if(x.job.state==='interest'&&!x.job.workerInterest)x.job.state='published';
   if(!JOB_STATES.includes(x.job.state))x.job.state='published';
   x.job.durationMs=Number(x.job.durationMs)||calcDurationMs(x.job.start||'20:00',x.job.end||'01:00');
   x.job.secureFlow={requested:false,authorized:false,conditionsViewed:false,...(x.job.secureFlow||{})};
   x.job.reviews={worker:null,biz:null,...(x.job.reviews||{})};
   x.job.ratedByWorker=Boolean(x.job.ratedByWorker);
   x.job.ratedByBusiness=Boolean(x.job.ratedByBusiness);
   x.job.pay=Number(x.job.pay)||75;
   x.job.workers=Math.max(1,Number(x.job.workers)||3);
   x.job.assignments=Array.isArray(x.job.assignments)?x.job.assignments:[];
   ensureOperationalState(x.job);
   if(x.job.rejectionNotice){
     x.job.rejectionNotice={
       type:'business_rejection',
       ts:Number(x.job.rejectionNotice.ts)||Date.now(),
       acknowledged:Boolean(x.job.rejectionNotice.acknowledged),
       acknowledgedAt:x.job.rejectionNotice.acknowledgedAt||null,
       ...x.job.rejectionNotice
     };
   }
   repairJobInvariant(x.job,x.marketplace);
 }
 
 x.jobs=x.jobs.filter(r=>r&&r.job&&r.id).map(r=>{
   r.id=r.job.id=r.id||r.job.id;
   r.marketplace=r.marketplace||null;
   r.chat=Array.isArray(r.chat)?r.chat:[];

function parseSchedule(raw, fallbackDate='Hoy'){
 const value=(raw||'').trim();
 const parts=value.split('·').map(x=>x.trim());
 const date=parts.length>1?parts[0]:fallbackDate;
 const times=(parts.length>1?parts[1]:parts[0]||'20:00–01:00').replace('-', '–').split('–').map(x=>x.trim());
 return {date:date||fallbackDate,start:times[0]||'20:00',end:times[1]||'01:00'};
}
function calcDurationMs(start,end){
 const [sh,sm]=(start||'20:00').split(':').map(Number), [eh,em]=(end||'01:00').split(':').map(Number);
 let s=(sh||0)*60+(sm||0), e=(eh||0)*60+(em||0);
 if(e<=s)e+=24*60;
 return Math.max(30,(e-s))*60*1000;
}
function durationLabel(job=S.job){
 const ms=job?.durationMs||0, mins=Math.round(ms/60000), h=Math.floor(mins/60), m=mins%60;
 if(!h)return `${m} min`;
 return m?`${h} h ${m} min`:`${h} h`;
}

function selectCandidate(id){
 const c=S.marketplace?.candidates?.find(x=>x.id===id);if(!c)return;
 if(c.status!=='interested'){toast('Este profesional no tiene una candidatura activa');return;}
 if(!roleMatches(c.role,S.job.role)){toast('Perfil incompatible con este Curro');return;}
 if(!candidateScheduleFits(c,S.job)){toast('El horario ya no encaja con la disponibilidad del profesional');return;}
 if(candidateConflictForJob(c,S.job)){toast('El profesional tiene un conflicto horario');return;}
 if(marketOccupied()>=marketTotal()){toast('No quedan plazas libres');return;}
 if(id==='p1'){selectWorker();return;}
 const previous=c.status;
 c.status='selected';
 const a=upsertAssignment(c);
 if(!a){c.status=previous;toast('No quedan plazas libres');return;}
 a.state='selected';a.slotReleased=false;
 recomputeJobSummaryState();
 clearUrgentReplacementIfCovered();save();renderAll();toast(c.name+' seleccionado ✓');
}

function scheduledEndTimestamp(job=S.job){
 if(!job)return null;
 const dayOffset=scheduleDayIndex(job.date);
 const [h,m]=(job.end||'01:00').split(':').map(Number);
 const d=new Date();
 d.setHours(0,0,0,0);
 d.setDate(d.getDate()+dayOffset);
 d.setHours(h||0,m||0,0,0);
 const [sh,sm]=(job.start||'20:00').split(':').map(Number);
 const startMinutes=(sh||0)*60+(sm||0);
 const endMinutes=(h||0)*60+(m||0);
 if(endMinutes<=startMinutes)d.setDate(d.getDate()+1);
 return d.getTime();
}
function actualEndTimestamp(job=S.job){
 return Number(job?.actualEndAt)||Number(job?.shiftEndAt)||null;
}
function extraTimeMs(job=S.job){
 const end=scheduledEndTimestamp(job),actual=actualEndTimestamp(job);
 if(!end||!actual)return 0;
 return Math.max(0,actual-end);
}
function formatDurationShort(ms){
 const total=Math.max(0,Math.round(ms/60000));
 const h=Math.floor(total/60),m=total%60;
 if(h&&m)return `${h} h ${m} min`;
 if(h)return `${h} h`;
 return `${m} min`;
}
function extraTimeStatus(job=S.job){
 const ms=extraTimeMs(job);
 const min=Math.round(ms/60000);
 return {
   ms,
   late:ms>0,
   suspicious:min>=180,
   label:ms>0?`+${formatDurationShort(ms)}`:'0 min'
 };
}

function simulateExtraTime(minutes){
 if(!S.job)return;
 const end=scheduledEndTimestamp(S.job);
 if(!end){toast('No se pudo calcular el fin previsto');return;}
 const m=Math.max(0,Number(minutes)||0);
 S.job.actualEndAt=end+m*60000;
 S.job.shiftEndAt=S.job.actualEndAt;
 const a=assignmentFor('p1');
 if(a){a.actualEndAt=S.job.actualEndAt;a.shiftEndAt=S.job.actualEndAt;}
 if(stateIndex(S.job.state)<stateIndex('payment_pending'))S.job.state='payment_pending';
 if(a && stateIndex(a.state)<stateIndex('payment_pending'))a.state='payment_pending';
 save();renderAll();toast(`QA: tiempo adicional simulado +${m} min`);
}

 const a=assignmentFor('p1');

}

function extraTimeSummaryHTML(job=S.job){
 if(!job)return '';
 const end=scheduledEndTimestamp(job),actual=actualEndTimestamp(job);
 if(!actual)return '';
 const x=extraTimeStatus(job);
 const endText=end?new Date(end).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';
 const actualText=new Date(actual).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
 return `<div class="card"><h3>Tiempo del Curro</h3>
   <div class="doc-line"><span>Fin previsto</span><strong>${endText}</strong></div>

       : '<div class="notice"><strong>Dato informativo</strong><br>El tiempo adicional registrado no implica automáticamente un importe adicional.</div>'

function workerConfirmPaid(){

 if(!paidByBusiness){toast('El negocio todavía no ha marcado el pago');return;}
 if(S.job.workerPaid||a?.workerPaid){
   S.job.workerPaid=true;S.job.businessPaid=true;S.job.state='closed';
   if(a){a.workerPaid=true;a.businessPaid=true;a.state='closed';}
   notifyRole('biz','closed','Cobro confirmado',`${S.worker.name} ha confirmado el cobro de ${S.job.id}.`,S.job.id);
 save();renderAll();toast('El cobro ya estaba confirmado');
   return;
 }
 S.job.businessPaid=true;S.job.workerPaid=true;S.job.state='closed';
 if(a){a.businessPaid=true;a.workerPaid=true;a.state='closed';}
 S.worker.money+=S.job.pay;S.worker.completed++;S.relation.jobsTogether++;
 systemMsg('Jonathan ha confirmado el cobro. Curro cerrado.');
 if(!S.history.some(h=>h.id===S.job.id)){
   S.history.unshift({
     id:S.job.id,role:S.job.role,venue:S.job.venue,zone:S.job.zone,date:S.job.date,
     start:S.job.start,end:S.job.end,pay:S.job.pay,status:'closed',archived:false,closedAt:Date.now()
   });
 }
 save();renderAll();toast(`+${money(S.job.pay)} · Curro cerrado`);
}

function fmtTime(ms){
 const total=Math.ceil(ms/1000), h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
 return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function shiftTimerHTML(){
 if(!S.job?.shiftEndAt || !['checked_in','working'].includes(S.job.state))return '';
 return `<div class="shift-clock">
   <div class="clock-label">Tiempo restante de contrato</div>
   <div id="shiftCountdown" class="clock-time">${fmtTime(shiftRemaining())}</div>
   <div class="clock-sub">El contador se inició con el check-in · Te avisaremos al finalizar.</div>
   <button class="mini-action" onclick="simulateContractEnd()">Simular fin de contrato</button>
 </div>`;
}
function updateShiftTimer(){
 const el=document.getElementById('shiftCountdown');
 if(el) el.textContent=fmtTime(shiftRemaining()||0);
 if(S.job?.shiftEndAt && ['checked_in','working'].includes(S.job.state) && Date.now()>=S.job.shiftEndAt){
   contractEndAlarm();
 }
}
function playAlarm(){
 try{
   const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   const c=new C();
   [0,.22,.44].forEach((d,i)=>{
     const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
     o.frequency.value=i%2?760:920;g.gain.value=.055;o.start(c.currentTime+d);o.stop(c.currentTime+d+.16);
   });
 }catch(e){}
 try{navigator.vibrate?.([250,120,250,120,400])}catch(e){}
}
function contractEndAlarm(){
 if(!S.job || !['checked_in','working'].includes(S.job.state))return;
 S.job.state='payment_pending'; S.job.shiftEndAt=null;
 const a=assignmentFor('p1');if(a){a.state='payment_pending';a.shiftEndAt=null;}
 systemMsg('Ha finalizado el tiempo contratado. El servicio pasa a pendiente de pago.');
 save();renderAll();playAlarm();
 try{
   if('Notification' in window && Notification.permission==='granted'){
     new Notification('Curro & Parné',{body:`Ha finalizado el tiempo contratado de ${S.job.id}.`});
   }
 }catch(e){}
 openModal(`<div class="call-box"><div class="call-icon" style="background:var(--copper)">⏱</div><span class="alarm-badge">TURNO FINALIZADO</span><h2>Ha finalizado el tiempo contratado</h2><p class="muted">${S.job.id} · ${S.job.venue}</p><div class="notice">El servicio ha pasado automáticamente a pendiente de pago.</div><br><button class="btn copper" onclick="closeModal();renderAll()">Entendido</button></div>`);
}
function simulateContractEnd(){
 if(S.job){S.job.shiftEndAt=Date.now();save();updateShiftTimer();}
}

function jobHasCommittedCoverage(job=S.job){
 if(!job)return false;
 return (job.assignments||[]).some(a=>assignmentConsumesSlot(a)&&!a.slotReleased)
   || referralConsumesSlot(S.referral);
}
function jobHasActiveInterest(job=S.job,marketplace=S.marketplace){
 if(!job)return false;
 const statuses=(marketplace?.candidates||[]).map(c=>c.status);
 return statuses.some(s=>['invited','interested','selected'].includes(s))
   || ['interest','selected','docs_pending','terms_pending','worker_accept_pending','confirmed','preparing','en_route','arrived','checked_in','working','finished','payment_pending','business_paid'].includes(job.state);
}
function canDeleteJobPermanently(job=S.job,marketplace=S.marketplace){
 if(!job)return false;
 ensureOperationalState(job);
 const noAssignments=!(job.assignments||[]).length;
 const noReferral=!S.referral || !['selected','completed','closed'].includes(S.referral?.assignment?.status);
 const noInterest=!jobHasActiveInterest(job,marketplace);
 const noIncidents=!(job.incidents||[]).length;
 return job.state==='published' && noAssignments && noReferral && noInterest && noIncidents;
}

function deletePublishedJob(){
 if(!S.job||!canDeleteJobPermanently()){toast('Esta oferta ya no puede eliminarse directamente');return;}
 const id=S.job.id;
 S.jobs=(S.jobs||[]).filter(r=>r.id!==id);
 S.notifications=(S.notifications||[]).filter(n=>n.jobId!==id);
 S.history=(S.history||[]).filter(h=>h.jobId!==id&&h.id!==id);
 S.job=null;S.activeJobId=S.jobs[0]?.id||null;S.marketplace=null;S.chat=[];S.referral=null;
 if(S.activeJobId)loadJobRecord(S.activeJobId);
 closeModal();save();renderAll();toast(`Oferta ${id} eliminada`);
}
function cancelWholeJob(){
 if(!S.job)return;
 ensureOperationalState();
 const id=S.job.id;
 const affected=[];
 for(const a of (S.job.assignments||[])){
   if(!assignmentConsumesSlot(a)||a.slotReleased)continue;
   if(['working','finished','payment_pending','business_paid','closed'].includes(a.state)){
     toast('No puedes cancelar un Curro que ya está trabajado o en pago');
     return;
   }
 }
 for(const a of (S.job.assignments||[])){
   if(assignmentConsumesSlot(a)&&!a.slotReleased){
     const previous=a.state;
     a.state='cancelled';a.slotReleased=true;a.releasedAt=Date.now();a.releaseReason='job_cancelled';
     a.previousState=previous;a.cancelledBy='business';a.cancelReasonCode='job_cancelled';
     affected.push(a.candidateId);
     if(a.candidateId==='p1'){
       S.job.workerDecision='cancelled_by_business';
       notifyRole('worker','cancellation','Curro cancelado',
         `${S.business.name} ha cancelado ${id}.`,id);
     }
   }
 }
 if(S.referral?.assignment && referralConsumesSlot(S.referral)){
   const st=S.referral.assignment.status;
   if(['completed','closed'].includes(st)){
     toast('No puedes cancelar un Curro ya completado por un recomendado');
     return;
   }
   S.referral.assignment.status='cancelled';
   S.referral.assignment.slotReleased=true;
   S.referral.assignment.releasedAt=Date.now();
   S.referral.assignment.releaseReason='job_cancelled';
   S.referral.assignment.cancelledBy='business';
   S.referral.assignment.cancelReasonCode='job_cancelled';
 }
 (S.marketplace?.candidates||[]).forEach(c=>{
   if(['invited','interested'].includes(c.status)){
     if(c.id==='p1')notifyRole('worker','cancellation','Curro retirado',
       `${S.business.name} ha retirado ${id}.`,id);
     c.status='available';
   }
 });
 S.job.state='cancelled';
 S.job.cancelledAt=Date.now();
 S.job.cancelledBy='business';
 S.job.cancelReason='job_cancelled';
 addOperationalEvent('job_cancelled','business',{affected});
 S.job.urgentReplacement={active:false,triggeredAt:null,source:null,candidateId:null,reason:null,resolvedAt:Date.now()};
 closeModal();save();renderAll();toast(`Curro ${id} cancelado`);
}

function assignmentAction(candidateId,action){
 const a=assignmentFor(candidateId);const c=assignmentCandidate(candidateId);
 if(!a||!c){toast('No se encontró la plaza');return;}
 const transitions={
   request_docs:['selected','selected'],
   authorize:['selected','selected'],
   begin_docs:['selected','docs_pending'],
   docs_ok:['docs_pending','terms_pending'],
   send_terms:['terms_pending','worker_accept_pending'],
   accept_terms:['worker_accept_pending','confirmed'],
   preparing:['confirmed','preparing'],
   en_route:['preparing','en_route'],
   arrived:['en_route','arrived'],
   checkin:['arrived','checked_in'],
   working:['checked_in','working'],
   finished:['working','finished'],
   payment:['finished','payment_pending'],
   business_paid:['payment_pending','business_paid'],
   closed:['business_paid','closed']
 };
 if(action==='request_docs'){
   if(a.state!=='selected'){toast('Acción no disponible');return;}
   a.secureFlow.requested=true;
 }else if(action==='authorize'){
   if(a.state!=='selected'||!a.secureFlow.requested){toast('Falta solicitud de datos');return;}
   a.secureFlow.authorized=true;
 }else{
   const tr=transitions[action];if(!tr||a.state!==tr[0]){toast('Acción no disponible en este estado');return;}
   if(action==='begin_docs'&&!a.secureFlow.authorized){toast('Falta autorización del profesional');return;}
   a.state=tr[1];
   if(action==='checkin')a.checkedInAt=Date.now();
   if(action==='finished'){a.actualEndAt=Date.now();a.shiftEndAt=a.actualEndAt;}
   if(action==='business_paid')a.businessPaid=true;
   if(action==='closed')a.workerPaid=true;
 }
 recomputeJobSummaryState();save();renderAll();toast(`${c.name} · ${assignmentLabel(a.state)}`);
}
function assignmentReference(candidateId,side){
 const a=assignmentFor(candidateId);if(!a||a.state!=='closed'){toast('La plaza debe estar cerrada');return;}
 if(side==='biz')a.ratedByBusiness=true;else a.ratedByWorker=true;
 recomputeJobSummaryState();save();renderAll();toast('Referencia registrada');
}

function businessAttentionReasons(r){
 const j=r?.job;
 if(!j)return [];
 ensureOperationalState(j);
 const reasons=[];
 const open=Math.max(0,Math.max(1,Number(j.workers)||1)-occupiedSlotsFor(j,r.referral));
 const openIncidents=(j.incidents||[]).filter(i=>i.status==='open').length;
 if(j.urgentReplacement?.active && open>0)reasons.push({key:'replacement',label:`Reemplazo prioritario · ${open} ${open===1?'plaza':'plazas'}`,tone:'red'});
 if(openIncidents)reasons.push({key:'incident',label:`${openIncidents} ${openIncidents===1?'incidencia abierta':'incidencias abiertas'}`,tone:'red'});
 if(j.state==='interest')reasons.push({key:'candidate',label:'Candidaturas por revisar',tone:'gold'});
 if(['selected','docs_pending','terms_pending','worker_accept_pending'].includes(j.state))reasons.push({key:'contract',label:'Contratación pendiente',tone:'gold'});
 if(['confirmed','preparing','en_route','arrived','checked_in','working'].includes(j.state))reasons.push({key:'service',label:'Servicio en curso',tone:'green'});
 if(['finished','payment_pending'].includes(j.state))reasons.push({key:'payment',label:'Pago pendiente',tone:'gold'});
 if(j.state==='business_paid')reasons.push({key:'payment_confirm',label:'Esperando confirmación de cobro',tone:'gold'});
 if(j.state==='closed' && !j.ratedByBusiness)reasons.push({key:'review',label:'Referencia pendiente',tone:'gold'});
 const unread=unreadNotificationsForJob('biz',r.id).length;
 if(unread)reasons.push({key:'unread',label:`${unread} ${unread===1?'novedad':'novedades'} sin leer`,tone:'gold'});
 return reasons;
}

function submitReview(role){
 if(!requireJobState('closed','Publicar referencia'))return;
 const already=role==='worker'?S.job.ratedByWorker:S.job.ratedByBusiness;
 if(already){toast('La referencia ya está publicada');return;}
 const current=S.job.reviews?.[role]||{};
 if(!current.stars){toast('Elige entre 1 y 5 estrellas');return;}
 const el=document.getElementById(`reviewComment_${role}`);
 const comment=(el?.value??current.draftComment??'').trim();
 const review={stars:current.stars,comment,ts:Date.now()};
 S.job.reviews[role]=review;
 const author=role==='worker'?S.worker.name:S.business.name;
 const target=role==='worker'?S.business.name:S.worker.name;
 S.reviews=S.reviews.filter(r=>!(r.jobId===S.job.id&&r.role===role));
 S.reviews.push({
   jobId:S.job.id,
   author,
   target,
   role,
   stars:review.stars,
   comment,
   ts:review.ts,
   roleName:S.job.role,
   venue:S.job.venue,
   date:S.job.date,
   start:S.job.start,
   end:S.job.end
 });
 if(role==='worker')S.job.ratedByWorker=true; else S.job.ratedByBusiness=true;
 if(S.job.ratedByWorker&&S.job.ratedByBusiness)S.relation.mutualRating=true;
 markCurrentHistoryArchived();
 syncJonathanAssignmentFromJob();save();renderAll();toast('Referencia profesional guardada ✓');
}

function escapeHTML(s){

}
function averageReferenceRating(targetRole){

 const items=S.reviews.filter(r=>r.role===sourceRole&&Number(r.stars));
 if(!items.length)return targetRole==='worker'?S.worker.rating:S.business.rating;
 return (items.reduce((a,r)=>a+Number(r.stars),0)/items.length).toFixed(1);
}

function releaseReferralSlot(reason='cancelled',meta={}){
 ensureReferral();
 const st=S.referral?.assignment?.status;
 if(!['selected'].includes(st)){toast('La plaza recomendada ya no puede liberarse');return false;}
 const a=S.referral.assignment;
 a.status=reason;
 a.slotReleased=true;
 a.releasedAt=Date.now();
 a.releaseReason=reason;
 a.cancelledBy=meta.actor||'business';
 a.cancelReasonCode=meta.reasonCode||reason;
 S.referral.candidate.status='available';
 S.referral.status='interested';
 addOperationalEvent(reason==='no_show'?'no_show_release':'cancellation',meta.actor||'business',{
   candidateId:'ref1',reason:meta.reasonCode||reason,source:'referral'
 });
 systemMsg(reason==='no_show'
   ? 'La plaza del profesional recomendado se libera por no presentación.'
   : `La plaza del recomendado ha sido liberada (${cancellationReasonLabel(meta.reasonCode||reason)}).`);
 activateUrgentReplacement('ref1',meta.reasonCode||reason,'referral');
 save();renderAll();
 return true;
}
function referralSet(st){
 ensureReferral();
 const allowed={
   idle:['sent'], sent:['verified'], verified:['interested'], interested:['selected'],
   selected:['completed'], completed:['unlocked'], unlocked:[]
 };
 if(!(allowed[S.referral.status]||[]).includes(st)){toast('Ese paso no corresponde todavía');return;}
 if(st==='selected'){
   if(!S.job || !roleMatches(S.referral.candidate.role,S.job.role)){toast('El recomendado no es compatible con este puesto');return;}
   if(marketOccupied()>=marketTotal()){toast('No quedan plazas libres');return;}
   S.referral.candidate.status='selected';
   S.referral.assignment.status='selected';
   S.referral.assignment.selectedAt=Date.now();
 }
 if(st==='completed'){
   if(S.referral.assignment.status!=='selected'){toast('No existe una asignación válida');return;}
   S.referral.assignment.status='completed';

function reconcileProfessionalJobState(){
 if(!S.job)return;
 ensureMarketplace();ensureAssignments();
 const me=S.marketplace.candidates.find(c=>c.id==='p1');if(!me)return;
 const a=assignmentFor('p1');
 const activeAssignment=a&&assignmentConsumesSlot(a);
 if(S.job.workerDecision==='interested'){
   S.job.workerInterest=true;
   if(S.job.state==='published')S.job.state='interest';
   if(me.status!=='selected')me.status='interested';
 }
 if(S.job.state==='interest'&&S.job.workerInterest&&S.job.workerDecision!=='selected'){
   S.job.workerDecision='interested';
   if(me.status!=='selected')me.status='interested';
 }
 if(S.job.workerDecision==='selected' || activeAssignment){
   S.job.workerDecision='selected';
   me.status='selected';
 }
 if(['cancelled_by_worker','cancelled_by_business'].includes(S.job.workerDecision) && a?.slotReleased){

   S.job.workerInterest=false;
 }
 if(S.job.workerDecision==='rejected_by_worker')me.status='worker_rejected';
 if(S.job.workerDecision==='withdrawn')me.status='worker_withdrawn';
 if(S.job.workerDecision==='rejected_by_business')me.status='rejected';
}

function ensureWorkerAvailability(){

   S.worker.availability={
     instant:true,mode:'open',

     updatedAt:null
   };
 }
 return S.worker.availability;
}
function availabilityDayKey(label){
 const s=String(label||'').toLowerCase();
 if(s.includes('mañana'))return 'tomorrow';
 if(s.includes('hoy'))return 'today';
 return null;
}
function availabilityWindowMinutes(slot){
 const start=hmMinutes(slot?.start||'00:00');
 let end=hmMinutes(slot?.end||'23:59');
 if(end<=start)end+=1440;
 return [start,end];
}
function jobWindowWithinDay(job){
 const start=hmMinutes(job?.start||'00:00');
 let end=hmMinutes(job?.end||'00:00');
 if(end<=start)end+=1440;
 return [start,end];
}
function availabilityCoversJob(job){
 const av=ensureWorkerAvailability();
 if(!S.worker.available)return false;
 if(av.mode!=='custom')return true;
 const key=availabilityDayKey(job?.date);
 if(!key)return true; // el prototipo solo planifica Hoy/Mañana
 const slot=av[key];
 if(!slot?.enabled)return false;
 const [as,ae]=availabilityWindowMinutes(slot);
 const [js,je]=jobWindowWithinDay(job);
 return js>=as && je<=ae;
}
function availabilitySummary(){
 const av=ensureWorkerAvailability();
 if(!S.worker.available)return 'Disponibilidad pausada';
 if(av.mode==='open')return 'Horario abierto';
 const pieces=[];
 if(av.today?.enabled)pieces.push(`Hoy ${av.today.start}–${av.today.end}`);
 if(av.tomorrow?.enabled)pieces.push(`Mañana ${av.tomorrow.start}–${av.tomorrow.end}`);
 return pieces.length?pieces.join(' · '):'Sin franjas activas';
}

function normalizeRoleName(v){
 return (v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function roleFamily(v){
 const r=normalizeRoleName(v);
 if(r.includes('ayudante de cocina'))return 'ayudante_cocina';
 if(r.includes('chef de partida'))return 'chef_partida';
 if(r.includes('cocinero')||r.includes('cocinera'))return 'cocinero';
 if(r.includes('bartender')||r.includes('barman')||r.includes('barwoman')||r==='barra')return 'bartender';
 if(r.includes('camarer')||r==='sala'||r.includes('sala y terraza'))return 'camarero';
 return r;
}
function roleMatches(candidateRole, jobRole){
 const candidateKey=roleFamily(candidateRole);
 const jobKey=roleFamily(jobRole);
 return candidateKey===jobKey;
}
function candidateIsAvailable(c){

 return true;

function matchingHash(text){
 let h=2166136261;
 for(const ch of String(text||'')){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
 return h>>>0;
}
function candidateDistanceKm(c){
 const raw=String(c?.distance||'').replace(',','.').match(/\d+(?:\.\d+)?/);
 return raw?Number(raw[0]):99;
}
function candidateScheduleFits(c,job=S.job){
 if(!c||!job)return false;
 if(c.id==='p1')return availabilityCoversJob(job);
 if(c.availability===false)return false;
 const key=availabilityDayKey(job.date);
 const windows=c.availabilityWindows||{};
 const slot=key?windows[key]:null;
 if(!slot)return true;
 if(slot.enabled===false)return false;
 const [as,ae]=availabilityWindowMinutes(slot);
 const [js,je]=jobWindowWithinDay(job);
 return js>=as&&je<=ae;
}
function candidateConflictForJob(c,job=S.job){
 if(!c||!job)return null;
 if(c.id==='p1')return workerScheduleConflict(job);
 return null; // En producción se calculará con los compromisos reales del candidato.
}
function candidateZoneLevel(c){
 const km=candidateDistanceKm(c);
 if(km<=4)return 'near';
 if(km<=8)return 'compatible';
 return 'far';
}
function candidateCompatibility(c,job=S.job){
 if(!c||!job)return {eligible:false,level:'none',reasons:[]};
 const role=roleMatches(c.role,job.role);
 const schedule=candidateScheduleFits(c,job);
 const conflict=candidateConflictForJob(c,job);
 const available=candidateIsAvailable(c);
 const zone=candidateZoneLevel(c);
 const eligible=role&&schedule&&!conflict&&available;
 const reasons=[];
 if(role)reasons.push('Puesto compatible');
 if(schedule)reasons.push('Disponible en ese horario');
 if(zone==='near')reasons.push(`${c.distance} · cerca`);
 else if(zone==='compatible')reasons.push(`${c.distance} · zona compatible`);
 else reasons.push(`${c.distance} · más lejos`);
 if(c.newcomer)reasons.push('Nuevo · oportunidad equivalente');
 else if(c.team)reasons.push('Ya existe confianza');
 const level=!eligible?'blocked':zone==='near'?'high':'good';
 return {eligible,role,schedule,conflict,available,zone,level,reasons};
}
function candidateFairRotationKey(c,job=S.job){
 return matchingHash(`${job?.id||'JOB'}|${c.id}|fair-v2`);
}
function matchingLevelLabel(c){
 const m=candidateCompatibility(c,S.job);
 if(!m.eligible)return 'NO DISPONIBLE';
 return m.level==='high'?'MATCH ALTO':'COMPATIBLE';
}
function matchingWhyHTML(c){
 const m=candidateCompatibility(c,S.job);
 const chips=m.reasons.map(r=>`<span class="reason ${c.newcomer&&r.includes('Nuevo')?'newcomer':''}">${r}</span>`).join('');
 return `<div class="match-reasons">${chips}</div>`;

function marketList(){
 const all=(S.marketplace?.candidates||[]).slice();
 if(!S.job)return all.sort((a,b)=>candidateFairRotationKey(a)-candidateFairRotationKey(b));
 return all.filter(c=>{
   const engaged=['invited','interested','selected'].includes(c.status);
   const notRejected=!['rejected','worker_rejected','worker_withdrawn'].includes(c.status);
   if(!notRejected||!roleMatches(c.role,S.job.role))return false;
   return engaged || candidateCompatibility(c,S.job).eligible;
 }).sort((a,b)=>{
   const aExact=normalizeRoleName(a.role)===normalizeRoleName(S.job.role)?1:0;
   const bExact=normalizeRoleName(b.role)===normalizeRoleName(S.job.role)?1:0;
   if(aExact!==bExact)return bExact-aExact;
   const am=candidateCompatibility(a,S.job),bm=candidateCompatibility(b,S.job);
   const az=am.zone==='near'?0:am.zone==='compatible'?1:2;
   const bz=bm.zone==='near'?0:bm.zone==='compatible'?1:2;
   if(az!==bz)return az-bz;
   // La reputación NO ordena. Rotación determinista distinta para cada Curro.
   return candidateFairRotationKey(a,S.job)-candidateFairRotationKey(b,S.job);
 });
}

function assignmentConsumesSlot(a){
 if(!a)return false;
 // Closed/completed work is historical coverage and never reopens the slot.
 if(['closed','finished','payment_pending','business_paid','working','checked_in','arrived','en_route','preparing','confirmed',
     'worker_accept_pending','terms_pending','docs_pending','selected'].includes(a.state))return !a.slotReleased;
 return false;
}
function assignmentIsReplaceable(a){
 if(!a)return false;
 return !!a.slotReleased || ['cancelled','no_show','replaced'].includes(a.state);
}
function releaseAssignmentSlot(candidateId,reason='cancelled',meta={}){
 const a=assignmentFor(candidateId);
 if(!a){toast('No se encontró la asignación');return false;}
 if(['working','finished','payment_pending','business_paid','closed'].includes(a.state)){
   toast('Una plaza ya trabajada no puede liberarse');
   return false;
 }
 const previous=a.state;
 a.state=reason;
 a.slotReleased=true;
 a.releasedAt=Date.now();
 a.releaseReason=reason;
 a.previousState=previous;
 a.cancelledBy=meta.actor||a.cancelledBy||'business';
 a.cancelReasonCode=meta.reasonCode||reason;
 if(S.marketplace?.candidates){
   const c=S.marketplace.candidates.find(x=>x.id===candidateId);
   if(c&&c.status==='selected')c.status='available';
 }
 addOperationalEvent(reason==='no_show'?'no_show':'cancellation',meta.actor||'business',{
   candidateId,reason:meta.reasonCode||reason,previousState:previous
 });
 systemMsg(`${a.name} ha liberado su plaza (${cancellationReasonLabel(meta.reasonCode||reason)}).`);
 if(candidateId==='p1'){
   if((meta.actor||'business')==='worker'){
     S.job.workerDecision='cancelled_by_worker';
     notifyRole('biz','cancellation','El profesional ha cancelado',
       `${a.name} ha cancelado ${S.job.id}: ${cancellationReasonLabel(meta.reasonCode||reason)}.`,S.job.id);
   }else{
     S.job.workerDecision='cancelled_by_business';
     notifyRole('worker','cancellation','El negocio ha cancelado tu plaza',
       `${S.business.name} ha cancelado tu asignación en ${S.job.id}: ${cancellationReasonLabel(meta.reasonCode||reason)}.`,S.job.id);
   }
 }
 activateUrgentReplacement(candidateId,meta.reasonCode||reason,'assignment');
 recomputeJobSummaryState();
 save();renderAll();
 return true;
}

function referralConsumesSlot(ref=S.referral){
 if(ref?.assignment?.slotReleased)return false;
 const st=ref?.assignment?.status;
 return ['selected','completed','closed'].includes(st);
}
function occupiedSlotsFor(job=S.job,ref=S.referral){
 if(!job)return 0;
 const assignmentCount=(job.assignments||[]).filter(assignmentConsumesSlot).length;
 const referralCount=referralConsumesSlot(ref)&&ref?.jobId===job.id?1:0;
 return Math.min(Math.max(1,Number(job.workers)||1),assignmentCount+referralCount);
}
function openSlotsFor(job=S.job,ref=S.referral){
 if(!job)return 0;
 const total=Math.max(1,Number(job.workers)||1);
 return Math.max(0,total-occupiedSlotsFor(job,ref));
}

function marketSlots(){
 ensureReferral();ensureAssignments();
 let o='';
 const assigned=[];

 // Las assignments normales que consumen plaza siguen visibles incluso cuando están cerradas.
 for(const a of (S.job?.assignments||[])){
   if(assignmentConsumesSlot(a)){
     assigned.push({
       name:a.name,
       state:a.state,
       source:'assignment'
     });
   }
 }

 // La recomendación usa la misma regla de cobertura que marketOccupied().
 if(S.referral?.jobId===S.job?.id && referralConsumesSlot(S.referral)){
   const rs=S.referral.assignment?.status||'selected';
   assigned.push({
     name:S.referral.candidate?.name||'Recomendado',
     state:rs,
     source:'referral'
   });
 }

 const tt=marketTotal();
 for(let i=0;i<tt;i++){
   const a=assigned[i];
   if(a){
     const label=a.source==='referral'
       ? (a.state==='closed'?'Cerrado':a.state==='completed'?'Curro completado':'Seleccionado')
       : assignmentLabel(a.state);
     const cls=a.state==='closed'?'slot filled':'slot filled';
     o+=`<div class="${cls}">✓ ${escapeHTML(String(a.name||'Profesional').split(' ')[0])}<br><span class="muted">${label}</span></div>`;
   }else{
     o+=`<div class="slot">Plaza ${i+1}<br><span class="muted">Libre</span></div>`;
   }
 }
 return o;
}

 <div class="doc-line"><span>Puesto</span><strong>${match.role?'Compatible ✓':'No compatible'}</strong></div>
 <div class="doc-line"><span>Horario</span><strong>${match.schedule&&!match.conflict?'Compatible ✓':'No disponible'}</strong></div>
 <div class="doc-line"><span>Zona</span><strong>${match.zone==='near'?'Cercana':match.zone==='compatible'?'Compatible':'Lejana'}</strong></div>
 <div class="doc-line"><span>Resultado</span><strong>${matchingLevelLabel(c)}</strong></div></div>
 ${matchingWhyHTML(c)}`:''}
 ${c.newcomer?'<div class="notice"><strong>Nuevo en Curro & Parné</strong><br>No queda relegado por no tener todavía valoraciones. Si es compatible, participa en la rotación de oportunidades.</div>':`<div class="doc-section"><h4>Confianza</h4><div class="doc-line"><span>Curros</span><strong>${c.completed}</strong></div><div class="doc-line"><span>Valoración</span><strong>⭐ ${c.rating}</strong></div><div class="doc-line"><span>Puntualidad</span><strong>${c.punctuality}%</strong></div></div>`}
 <div class="doc-section"><h4>CV profesional</h4><div class="doc-line"><span>Estado</span><strong>${hasCV?'Disponible ✓':'No añadido'}</strong></div><div class="doc-line"><span>Privacidad</span><strong>Acceso controlado</strong></div></div>
 ${hasCV?`<button class="btn light" onclick="openCandidateCV('${c.id}')">Ver CV</button>`:'<div class="muted">Este profesional no ha añadido CV a su perfil.</div>'}
 <br><br><div class="notice"><strong>Orden justo</strong><br>La antigüedad, las estrellas y el número de Curros no compran visibilidad. La decisión final sigue siendo del negocio.</div><br>
 ${S.job&&c.status==='available'&&available&&(!match||match.eligible)?`<button class="btn copper" onclick="closeModal();inviteCandidate('${c.id}')">Invitar a este Curro</button><button class="btn light" onclick="closeModal();rejectCandidate('${c.id}')">Rechazar candidato</button>`:''}
 ${S.job&&c.status==='available'&&(!available||(match&&!match.eligible))?'<div class="notice">Este profesional no puede recibir esta invitación con las condiciones actuales del Curro.</div><br>':''}
 <button class="btn light" onclick="closeModal()">Cerrar</button>`);
}
function candidateCard(c){
 const full=marketOccupied()>=marketTotal();
 const match=candidateCompatibility(c,S.job);
 const st=c.status==='selected'?'<span class="pill green">Plaza asignada</span>':
 c.status==='invited'?'<span class="pill gold">Invitado</span>':
 c.status==='interested'?'<span class="pill green">Interesado</span>':
 full?'<span class="pill">CURRO COMPLETO</span>':
 `<span class="match-score">${matchingLevelLabel(c)}</span>`;
 const rr=c.newcomer?'Nuevo · sin referencias':`⭐ ${c.rating} · ${c.completed} Curros`;
 const urgent=S.job?.urgentReplacement?.active&&openSlotsFor()>0;
 return `<div class="match-card"><div class="row"><div class="person" style="padding:0"><div class="avatar">${c.initials}</div><div><strong>${c.name}</strong><div class="muted">${c.role} · ${rr}</div><div class="muted">${c.distance}${c.punctuality!==null?' · '+c.punctuality+'% puntualidad':''}</div></div></div>${st}</div>
 ${urgent&&c.status==='available'?'<div class="notice danger"><strong>Disponible para reemplazo prioritario</strong></div>':''}
 ${matchingWhyHTML(c)}
 <div class="notice"><strong>Matching V2</strong><br>Compatibilidad y oportunidad determinan la visibilidad. Valoraciones y experiencia sirven como contexto de confianza.</div><br>
 <div class="btnrow"><button class="btn light" onclick="candidateProfile('${c.id}')">Ver perfil</button>
 ${c.status==='available'&&!full&&match.eligible?`<button class="btn copper" onclick="inviteCandidate('${c.id}')">Invitar</button><button class="btn light" onclick="rejectCandidate('${c.id}')">Rechazar</button>`:''}
 ${c.status==='invited'&&!full?`<button class="btn green" onclick="acceptMarketplaceCandidate('${c.id}')">Simular aceptación</button><button class="btn light" onclick="rejectCandidate('${c.id}')">Rechazar</button>`:''}
 ${c.status==='interested'&&!full?`<button class="btn copper" onclick="selectCandidate('${c.id}')">Seleccionar</button><button class="btn light" onclick="businessRejectApplicant('${c.id}')">Rechazar candidatura</button>`:''}
 ${c.status==='selected'?`<button class="btn light" onclick="showCancellationModal('business','${c.id}')">Gestionar plaza</button>`:''}</div></div>`;
}
function marketplacePanel(){
 if(!S.job)return `<div class="section-title"><h2>Marketplace Málaga</h2></div><div class="empty"><h3>Publica un Curro para activar el matching</h3><p>La búsqueda parte siempre de una necesidad concreta.</p></div>`;
 const tt=marketTotal(),o=marketOccupied(),free=tt-o,tab=S.marketplace.tab||'recommended';
 let l=marketList();
 if(tab==='team')l=l.filter(c=>c.team);
 if(tab==='new')l=l.filter(c=>c.newcomer);
 if(tab==='rejected')l=rejectedCandidates();
 const roleText=S.job.role||'Profesional';
 const emptyText=tab==='rejected'?'No has rechazado candidatos para este Curro.':`No hay candidatos compatibles con ${roleText} en este filtro.`;
 const cards=tab==='rejected'
   ? l.map(c=>`<div class="match-card"><div class="row"><div class="person" style="padding:0"><div class="avatar">${c.initials}</div><div><strong>${c.name}</strong><div class="muted">${c.role} · Rechazado para ${S.job.id}</div></div></div><span class="pill">RECHAZADO</span></div><br><div class="btnrow"><button class="btn light" onclick="candidateProfile('${c.id}')">Ver perfil</button><button class="btn copper" onclick="restoreCandidate('${c.id}')">Recuperar candidato</button></div></div>`).join('')
   : l.map(candidateCard).join('');
 return `${urgentReplacementHTML()}<div class="market-hero"><div class="row"><div><div class="eyebrow">MARKETPLACE MÁLAGA</div><h2 style="margin:5px 0">${roleText} · ${o}/${tt} plazas cubiertas</h2><div class="muted">${S.job.date} · ${S.job.start}–${S.job.end} · ${money(S.job.pay)} por profesional</div></div><span class="pill gold">${free?free+' libres':'COMPLETO'}</span></div><div class="fill-track"><div class="fill-bar" style="width:${Math.round(o/tt*100)}%"></div></div><div class="slot-grid">${marketSlots()}</div></div>
 <div class="section-title"><h2>Encontrar ${roleText.toLowerCase()}</h2><span class="muted">${l.length} visibles</span></div>
 <div class="market-tabs"><button class="market-tab ${tab==='recommended'?'active':''}" onclick="setMarketTab('recommended')">Recomendados</button><button class="market-tab ${tab==='team'?'active':''}" onclick="setMarketTab('team')">Mi equipo</button><button class="market-tab ${tab==='new'?'active':''}" onclick="setMarketTab('new')">Nuevos</button><button class="market-tab ${tab==='rejected'?'active':''}" onclick="setMarketTab('rejected')">Rechazados</button></div>
 <div class="notice"><strong>Matching V2</strong><br>Primero comprobamos puesto, disponibilidad, horario y zona. Después aplicamos una rotación justa entre perfiles compatibles. La experiencia genera confianza, pero no compra visibilidad.</div>
 ${cards||`<div class="empty"><h3>${emptyText}</h3></div>`}
 ${tab!=='rejected'?referralBusinessCard():''}`;
}
